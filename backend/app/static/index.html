<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <title>AI Adventure Planner MVP</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero card green-card">
      <div class="logo-row">
        <div class="logo">A</div>
        <span>MVP 0.1</span>
      </div>
      <h1>Find a mini-adventure nearby</h1>
      <p>Enter your time, transport and interests. The app ranks nearby places using weather, route effort and fit.</p>
      <div class="hero-actions">
        <button id="useLocationBtn" class="button primary">Use my location</button>
        <button id="demoBtn" class="button ghost">Use Tivat demo</button>
      </div>
      <p id="locationStatus" class="status-text">Location is not set yet.</p>
    </section>

    <section class="card">
      <h2>Trip request</h2>
      <label>
        Free text
        <textarea id="requestText">Family trip for 5 hours with fortress, history and views.</textarea>
      </label>

      <div class="grid two">
        <label>
          Latitude
          <input id="lat" type="number" step="0.000001" value="42.4304" />
        </label>
        <label>
          Longitude
          <input id="lon" type="number" step="0.000001" value="18.6964" />
        </label>
      </div>

      <div class="grid two">
        <label>
          Available time
          <select id="availableMinutes">
            <option value="30">30 min</option>
            <option value="60">1 hour</option>
            <option value="120">2 hours</option>
            <option value="240">4 hours</option>
            <option value="300" selected>5 hours</option>
            <option value="480">All day</option>
          </select>
        </label>
        <label>
          Transport
          <select id="transportMode">
            <option value="walk">Walk</option>
            <option value="car" selected>Car</option>
            <option value="bike">Bike</option>
          </select>
        </label>
      </div>

      <div class="grid two">
        <label>
          Group
          <select id="groupType">
            <option value="solo">Solo</option>
            <option value="couple">Couple</option>
            <option value="family" selected>Family</option>
            <option value="dog">Dog</option>
          </select>
        </label>
        <label>
          Intensity
          <select id="intensity">
            <option value="easy" selected>Easy</option>
            <option value="medium">Medium</option>
            <option value="active">Active</option>
          </select>
        </label>
      </div>

      <div class="grid two">
        <label>
          Children ages
          <input id="childrenAges" value="6, 13" />
        </label>
        <label>
          Max walking km
          <input id="maxWalkingKm" type="number" step="0.1" value="3" />
        </label>
      </div>

      <label>
        Interests
        <div class="chips" id="interestChips">
          <button type="button" class="chip active" data-interest="history">History</button>
          <button type="button" class="chip active" data-interest="fortresses">Fortresses</button>
          <button type="button" class="chip active" data-interest="viewpoints">Viewpoints</button>
          <button type="button" class="chip" data-interest="nature">Nature</button>
          <button type="button" class="chip" data-interest="water">Water</button>
          <button type="button" class="chip" data-interest="food">Food</button>
          <button type="button" class="chip" data-interest="surprise me">Surprise me</button>
        </div>
      </label>

      <label class="switch-row">
        <input id="useLiveData" type="checkbox" checked />
        <span>Use live OSM / weather / routing when available</span>
      </label>

      <button id="searchBtn" class="button primary big">Find adventure</button>
    </section>

    <section id="loading" class="card loading hidden">
      <div class="spinner"></div>
      <h2>Analyzing options</h2>
      <p>Checking places, weather, travel time and risk rules.</p>
    </section>

    <section id="errorBox" class="card error hidden"></section>

    <section id="results" class="results hidden">
      <div class="section-title">
        <h2>Recommendations</h2>
        <span id="requestIdBadge"></span>
      </div>
      <div id="weatherBox" class="card"></div>
      <div id="dataWarnings"></div>
      <div id="cards"></div>
      <div id="rejectedBox" class="card"></div>
    </section>
  </main>

  <template id="recommendationTemplate">
    <article class="card recommendation">
      <div class="card-head">
        <div>
          <h3 class="title"></h3>
          <p class="description"></p>
        </div>
        <div class="score"></div>
      </div>
      <div class="badges"></div>
      <details>
        <summary>Score breakdown</summary>
        <div class="breakdown"></div>
      </details>
      <div class="why"></div>
      <div class="warnings"></div>
      <div class="actions">
        <a class="button primary map-link" target="_blank" rel="noopener">Open in Maps</a>
        <button class="button ghost feedback-up">👍 Useful</button>
        <button class="button ghost feedback-down">👎 Not useful</button>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
