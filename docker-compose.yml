services:
  app:
    build: .
    ports:
      - "8080:8000"
    volumes:
      # Persist the SQLite DB across container rebuilds. The app writes to
      # ./data relative to /app/backend (see SQLITE_PATH below).
      - ./data:/app/backend/data
    environment:
      - USE_OPEN_METEO_FALLBACK=true
      - SQLITE_PATH=./data/adventures.db
